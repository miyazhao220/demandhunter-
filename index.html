<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opportunity Cards Pilot</title>
  <style>
    :root {
      --bg: #f7f8fa;
      --surface: #ffffff;
      --surface-soft: #f1f4f7;
      --surface-tint: #edf7f5;
      --text: #18212f;
      --muted: #627083;
      --subtle: #8c97a5;
      --line: #dce3eb;
      --line-strong: #c6d0dc;
      --accent: #176b5f;
      --accent-strong: #0f4f47;
      --warn: #8a5a10;
      --warn-bg: #fff4df;
      --shadow: 0 12px 28px rgba(28, 40, 58, 0.06);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.55;
      letter-spacing: 0;
    }

    button, select { font: inherit; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .page {
      max-width: 1120px;
      margin: 0 auto;
      padding: 24px 22px 44px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      margin: -24px -22px 18px;
      padding: 18px 22px 14px;
      background: rgba(247, 248, 250, 0.96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }

    .topbar-inner {
      max-width: 1120px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(260px, 1fr) minmax(220px, 320px);
      gap: 16px;
      align-items: end;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.25;
      font-weight: 600;
    }

    .subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .field label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    select {
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      padding: 8px 10px;
      outline: none;
    }

    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(23, 107, 95, 0.12);
    }

    .sample-line {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 14px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 26px;
      max-width: 100%;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .notice {
      margin: 0 0 14px;
      padding: 10px 12px;
      border: 1px solid #efd8a9;
      border-radius: 8px;
      background: var(--warn-bg);
      color: var(--warn);
      font-size: 13px;
    }

    .opportunity-list { display: grid; gap: 10px; }

    .opportunity-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .opportunity-button {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      padding: 15px 16px;
    }

    .opportunity-button:hover { background: var(--surface-soft); }
    .opportunity-button.active { background: var(--surface-tint); }

    .row-main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 16px;
      align-items: start;
    }

    .rank-title {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      min-width: 0;
    }

    .rank {
      flex: 0 0 auto;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--surface-soft);
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .title {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.35;
      word-break: break-word;
    }

    .summary {
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
      word-break: break-word;
    }

    .metric {
      min-width: 78px;
      text-align: right;
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .metric strong {
      display: block;
      color: var(--text);
      font-size: 18px;
      line-height: 1.15;
      font-weight: 600;
    }

    .toggle-mark {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1px solid var(--line-strong);
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      line-height: 1;
    }

    .details {
      display: none;
      border-top: 1px solid var(--line);
      padding: 14px 16px 16px;
    }

    .details.open { display: block; }

    .judgement {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .fact {
      min-width: 0;
      padding: 10px;
      border-radius: 8px;
      background: var(--surface-soft);
    }

    .fact-label {
      color: var(--subtle);
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 5px;
    }

    .fact-value {
      color: var(--text);
      font-size: 13px;
      word-break: break-word;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 14px;
      align-items: start;
    }

    .section {
      min-width: 0;
      padding-top: 2px;
    }

    .section h2 {
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 600;
    }

    .section p {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 7px;
    }

    .list li {
      position: relative;
      padding-left: 14px;
      color: var(--muted);
      font-size: 13px;
      word-break: break-word;
    }

    .list li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0.72em;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
    }

    .cluster-list {
      display: grid;
      gap: 7px;
    }

    .cluster-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 10px;
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      text-align: left;
      cursor: pointer;
    }

    .cluster-row:hover, .cluster-row.active { background: var(--surface-tint); }

    .cluster-name {
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      word-break: break-word;
    }

    .cluster-count {
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .cluster-panel {
      display: grid;
      gap: 8px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-soft);
    }

    .cluster-panel-title {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      align-items: center;
      justify-content: space-between;
    }

    .evidence-list {
      grid-column: 1 / -1;
      display: grid;
      gap: 8px;
      margin-top: 2px;
    }

    .evidence-head {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      align-items: center;
      justify-content: space-between;
    }

    .evidence-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .small-button {
      min-height: 30px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      padding: 4px 9px;
      font-size: 12px;
      cursor: pointer;
    }

    .small-button:hover { background: var(--surface-soft); }

    .evidence {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 11px;
      background: var(--surface);
    }

    .quote {
      margin: 0 0 8px;
      color: var(--text);
      font-size: 13px;
      word-break: break-word;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 10px;
      color: var(--subtle);
      font-size: 12px;
    }

    .meta span { white-space: nowrap; }
    .context {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      word-break: break-word;
    }

    .loading, .empty {
      padding: 24px 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 820px) {
      .topbar-inner { grid-template-columns: 1fr; align-items: stretch; }
      .judgement { grid-template-columns: 1fr 1fr; }
      .detail-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 560px) {
      .page { padding: 18px 12px 34px; }
      .topbar { margin: -18px -12px 14px; padding: 14px 12px 12px; }
      h1 { font-size: 19px; }
      .row-main { grid-template-columns: minmax(0, 1fr) auto; gap: 10px; }
      .metric { grid-column: 1 / -1; text-align: left; padding-left: 36px; }
      .judgement { grid-template-columns: 1fr; }
      .opportunity-button { padding: 13px 12px; }
      .details { padding: 12px; }
      .meta span { white-space: normal; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="topbar-inner">
        <div>
          <h1>一年级家长机会卡片样板</h1>
          <p class="subtitle">基于既有一年级评论样本，先验证「需求 + 供给 + 验证缺口」的阅读形式。</p>
        </div>
        <div class="field">
          <label for="audienceSelect">人群</label>
          <select id="audienceSelect">
            <option value="grade1">小学一年级家长</option>
          </select>
        </div>
      </div>
    </header>

    <div class="notice">本页不重新采集数据。评论证据来自既有一年级样本；供给和缺口是为了验证页面形式的结构化初扫，需要后续人工和公开资料继续校验。</div>
    <div id="sampleLine" class="sample-line"></div>
    <div id="app" class="loading">正在读取已有样本数据...</div>
  </div>

        clusterIds: ["T12-C1", "T12-C2", "T12-C3", "T12-C4"],
        sentence: "家长在学习机、学习桌、护眼灯等工具选择时，希望既提升学习意愿又减少家长负担；目前靠测评、直播、同款推荐和评论区反馈决策；证据来自学习工具主题评论；还缺真实家庭使用后的效果和适配人群验证。",
        who: "有预算购买学习硬件或学习工具的一年级家庭",
        scene: "孩子学习习惯未成形、家长陪学吃力、视力和坐姿担忧同时出现时",
        problem: "家长不知道贵的工具是否值得、是否适合自家孩子、会不会买来闲置或加重屏幕依赖。",
        current: "看达人测评，问同款家长，比较价格和功能，在线下门店体验，或先买低价替代品。",
        supply: ["学习机、词典笔、打印机、护眼灯、学习桌椅", "内容会员和题库服务", "达人测评、导购直播、家长社群", "二手交易和租赁试用"],
        gap: "供给侧强调功能和参数，家长真正关心的是孩子是否会用、能不能减负、是否匹配当前学习问题。缺少场景化对比。",
        validation: ["评论中的购买决策是否集中在某几类硬件", "家长是否需要独立测评，还是更信任同龄同问题家庭反馈", "工具使用后的闲置率和真实效果如何采集"]
      },
      {
        id: "school-transition-rhythm",
        title: "入学适应与家庭节奏重建",
        themeIds: ["T03", "T05"],
        clusterIds: ["T03-C1", "T03-C2", "T03-C5", "T05-C1", "T05-C2"],
        sentence: "家长在幼小衔接到一年级初期，会被作息、作业、户外、早睡和是否超前学同时拉扯；目前靠攻略、时间表、提前学和家长互相比较解决；证据来自入学适应与幼小衔接评论；还缺对不同家庭节奏的个性化路径验证。",
        who: "大班到一年级过渡期家庭，以及刚上一年级的家长",
        scene: "开学前后，家庭作息被学校节奏重排，学习、运动、睡眠和兴趣班互相挤压",
        problem: "家长不知道该管多少、提前学多少、每天怎么安排才不会把孩子和自己都耗垮。",
        current: "看幼小衔接清单，提前练识字拼音数学，制定时间表，减少兴趣班，向同龄家长取经。",
        supply: ["幼小衔接课程和资料包", "时间管理表、习惯打卡工具", "育儿博主攻略和社群", "线下衔接班、托管和兴趣班组合"],
        gap: "现有内容给的是通用清单，缺少基于孩子能力、家庭时间和学校要求的取舍建议。家长需要做减法而不只是加任务。",
        validation: ["家长真正需要的是规划工具、咨询服务还是课程组合", "哪些家庭变量最影响方案，例如双职工、老人带娃、学校作业量", "是否能形成开学前后 30-60 天的陪跑产品"]
      },
      {
        id: "interest-class-portfolio",
        title: "兴趣班组合与取舍决策",
        themeIds: ["T13"],
        clusterIds: ["T13-C1", "T13-C2", "T13-C3", "T13-C4", "T13-C5"],
        sentence: "一年级家长在英语、书法、运动、艺术和口才等兴趣班选择时，需要在长期能力、升学竞争力、时间接送和孩子负担之间取舍；目前靠试听、同龄家长经验、机构推荐和家庭排期试错；证据来自兴趣班主题评论；还缺不同家庭预算和孩子特质下的组合验证。",
        who: "小学一年级及低年级家长，尤其是正在给孩子报多个兴趣班或准备减班的家庭",
        scene: "开学前后排课、周末接送、孩子兴趣变化、机构续费或试听后",
        problem: "家长不知道该保留哪些班、哪些只是跟风，既怕错过长期能力窗口，又怕孩子和家长都被时间表压垮。",
        current: "试听课程，问同龄家长，按价格和接送距离取舍，保留英语/运动/书法等刚需感更强的项目，或先报名再退课。",
        supply: ["线下兴趣班和体育训练机构", "英语、书法、口才、艺术类课程", "机构试听和团购", "家长社群和达人经验帖"],
        gap: "供给侧强调课程优势，家长真正缺的是按孩子特质、家庭时间、预算和长期目标做组合减法。",
        validation: ["家长最难取舍的是时间、价格、孩子兴趣还是升学/能力预期", "哪些兴趣班被认为是一年级刚需，哪些可延后", "是否需要独立的兴趣班组合规划工具或顾问服务"]
      }
    ];

    const app = document.getElementById("app");
    const sampleLine = document.getElementById("sampleLine");
    const INITIAL_EVIDENCE_LIMIT = 6;
    const EVIDENCE_PAGE_SIZE = 20;
    let mapData = null;
    let openId = null;
    let evidenceLimits = {};
    let openClusterIds = {};

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>'"]/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "'": "&#39;",
        "\"": "&quot;"
      }[char]));
    }

    function formatNum(value) {
      return Number(value || 0).toLocaleString("zh-CN");
    }

    function findTheme(id) {
      return (mapData.concern_themes || []).find(theme => theme.theme_id === id);
    }

    function findClusters(opp) {
      const clusters = [];
      for (const themeId of opp.themeIds) {
        const theme = findTheme(themeId);
        if (!theme) continue;
        for (const cluster of theme.need_pain_itch_clusters || []) {
          if (!opp.clusterIds.length || opp.clusterIds.includes(cluster.cluster_id)) clusters.push(cluster);
        }
      }
      return clusters.sort((a, b) => (b.comment_count || 0) - (a.comment_count || 0));
    }

    function countComments(opp) {
      if (opp.clusterIds.length) {
        return findClusters(opp).reduce((sum, cluster) => sum + (cluster.comment_count || 0), 0);
      }
      return findTheme(opp.themeIds[0])?.comment_count || 0;
    }

    function mergeSourceCounts(opp) {
      const counts = {};
      for (const themeId of opp.themeIds) {
        const theme = findTheme(themeId);
        for (const [source, count] of Object.entries(theme?.source_counts || {})) {
          counts[source] = (counts[source] || 0) + count;
        }
      }
      return Object.entries(counts).sort((a, b) => b[1] - a[1]);
    }

    function collectEvidence(opp) {
      const rows = [];
      for (const themeId of opp.themeIds) {
        const theme = findTheme(themeId);
        if (!theme) continue;
        for (const comment of theme.representative_comments || []) rows.push(comment);
        for (const cluster of theme.need_pain_itch_clusters || []) {
          if (!opp.clusterIds.includes(cluster.cluster_id)) continue;
          for (const comment of cluster.all_evidence || []) rows.push(comment);
          for (const comment of cluster.representative_comments || []) rows.push(comment);
        }
      }

      const seen = new Set();
      return rows
        .filter(comment => {
          const key = comment.comment_id || `${comment.source}-${comment.author_nickname}-${comment.comment_text}`;
          if (seen.has(key)) return false;
          seen.add(key);
          return Boolean(comment.comment_text);
        })
        .sort((a, b) => (b.like_count || 0) - (a.like_count || 0))
    }

    function collectClusterEvidence(cluster) {
      const seen = new Set();
      return [...(cluster.all_evidence || []), ...(cluster.representative_comments || [])]
        .filter(comment => {
          const key = comment.comment_id || `${comment.source}-${comment.author_nickname}-${comment.comment_text}`;
          if (seen.has(key)) return false;
          seen.add(key);
          return Boolean(comment.comment_text);
        })
        .sort((a, b) => (b.like_count || 0) - (a.like_count || 0));
    }

    function renderSampleLine() {
      const stats = mapData.sample_stats || {};
      const sourceCounts = stats.source_counts || {};
      sampleLine.innerHTML = [
        `<span class="pill">有效评论 ${formatNum(stats.valid_comment_count)}</span>`,
        `<span class="pill">原始评论 ${formatNum(stats.raw_comment_count)}</span>`,
        `<span class="pill">帖子/视频 ${formatNum(stats.post_count)}</span>`,
        `<span class="pill">小红书 ${formatNum(sourceCounts["小红书"])}</span>`,
        `<span class="pill">抖音 ${formatNum(sourceCounts["抖音"])}</span>`,
        `<span class="pill">搜索第一页样本</span>`
      ].join("");
    }

    function render() {
      if (!mapData) return;
      renderSampleLine();
      const cards = OPPORTUNITIES.map((opp, index) => renderCard(opp, index + 1)).join("");
      app.className = "opportunity-list";
      app.innerHTML = cards || `<div class="empty">暂无机会卡片。</div>`;
      app.querySelectorAll(".opportunity-button").forEach(button => {
        button.addEventListener("click", () => {
          openId = openId === button.dataset.id ? null : button.dataset.id;
          if (openId && !evidenceLimits[openId]) evidenceLimits[openId] = INITIAL_EVIDENCE_LIMIT;
          render();
        });
      });
      app.querySelectorAll("[data-evidence-action]").forEach(button => {
        button.addEventListener("click", event => {
          event.stopPropagation();
          const id = button.dataset.id;
          const action = button.dataset.evidenceAction;
          const total = Number(button.dataset.total || 0);
          const current = evidenceLimits[id] || INITIAL_EVIDENCE_LIMIT;
          if (action === "more") evidenceLimits[id] = Math.min(total, current + EVIDENCE_PAGE_SIZE);
          if (action === "all") evidenceLimits[id] = total;
          if (action === "less") evidenceLimits[id] = INITIAL_EVIDENCE_LIMIT;
          render();
        });
      });
      app.querySelectorAll("[data-cluster-id]").forEach(button => {
        button.addEventListener("click", event => {
          event.stopPropagation();
          const opportunityId = button.dataset.opportunityId;
          const clusterId = button.dataset.clusterId;
          openClusterIds[opportunityId] = openClusterIds[opportunityId] === clusterId ? null : clusterId;
          if (openClusterIds[opportunityId]) {
            const limitKey = clusterLimitKey(opportunityId, clusterId);
            if (!evidenceLimits[limitKey]) evidenceLimits[limitKey] = INITIAL_EVIDENCE_LIMIT;
          }
          render();
        });
      });
    }

    function renderCard(opp, rank) {
      const isOpen = openId === opp.id;
      const count = countComments(opp);
      const sourceText = mergeSourceCounts(opp).map(([source, value]) => `${source} ${formatNum(value)}`).join(" / ");
      return `
        <article class="opportunity-card">
          <button class="opportunity-button ${isOpen ? "active" : ""}" type="button" data-id="${escapeHtml(opp.id)}" aria-expanded="${isOpen}">
            <div class="row-main">
              <div class="rank-title">
                <span class="rank">${rank}</span>
                <div>
                  <div class="title">${escapeHtml(opp.title)}</div>
                  <div class="summary">${escapeHtml(opp.sentence)}</div>
                </div>
              </div>
              <div class="metric"><strong>${formatNum(count)}</strong>证据评论<br>${escapeHtml(sourceText)}</div>
              <span class="toggle-mark">${isOpen ? "−" : "+"}</span>
            </div>
          </button>
          <div class="details ${isOpen ? "open" : ""}">
            ${isOpen ? renderDetails(opp) : ""}
          </div>
        </article>
      `;
    }

    function renderDetails(opp) {
      const clusters = findClusters(opp);
      const evidence = collectEvidence(opp);
      const evidenceLimit = Math.min(evidence.length, evidenceLimits[opp.id] || INITIAL_EVIDENCE_LIMIT);
      const visibleEvidence = evidence.slice(0, evidenceLimit);
      return `
        <div class="judgement">
          <div class="fact"><div class="fact-label">谁</div><div class="fact-value">${escapeHtml(opp.who)}</div></div>
          <div class="fact"><div class="fact-label">什么场景</div><div class="fact-value">${escapeHtml(opp.scene)}</div></div>
          <div class="fact"><div class="fact-label">遇到什么问题</div><div class="fact-value">${escapeHtml(opp.problem)}</div></div>
          <div class="fact"><div class="fact-label">目前使用什么办法</div><div class="fact-value">${escapeHtml(opp.current)}</div></div>
        </div>
        <div class="detail-grid">
          <section class="section">
            <h2>现有供给</h2>
            <ul class="list">${opp.supply.map(item => `<li>${escapeHtml(item)}</li>`).join("")}</ul>
          </section>
          <section class="section">
            <h2>供给缺口</h2>
            <p>${escapeHtml(opp.gap)}</p>
            <h2>还缺什么验证</h2>
            <ul class="list">${opp.validation.map(item => `<li>${escapeHtml(item)}</li>`).join("")}</ul>
          </section>
          <section class="section">
            <h2>关联需求簇</h2>
            <div class="cluster-list">${clusters.map(cluster => renderClusterRow(opp, cluster)).join("")}</div>
          </section>
          <section class="section">
            <h2>证据说明</h2>
            <p>下面只展示评论原文，帖子标题仅作评论语境。默认按评论点赞数排序，先展示前 ${INITIAL_EVIDENCE_LIMIT} 条，可继续展开更多。</p>
          </section>
          <section class="section evidence-list">
            <div class="evidence-head">
              <h2>评论证据 ${formatNum(visibleEvidence.length)} / ${formatNum(evidence.length)}</h2>
              ${renderEvidenceActions(opp.id, evidenceLimit, evidence.length)}
            </div>
            ${visibleEvidence.map(renderEvidence).join("") || `<div class="empty">暂无评论证据。</div>`}
          </section>
        </div>
      `;
    }

    function renderClusterRow(opp, cluster) {
      const isOpen = openClusterIds[opp.id] === cluster.cluster_id;
      return `
        <button class="cluster-row ${isOpen ? "active" : ""}" type="button" data-opportunity-id="${escapeHtml(opp.id)}" data-cluster-id="${escapeHtml(cluster.cluster_id)}" aria-expanded="${isOpen}">
          <span class="cluster-name">${escapeHtml(cluster.name)}</span>
          <span class="cluster-count">${formatNum(cluster.comment_count)} 条</span>
          <span class="toggle-mark">${isOpen ? "−" : "+"}</span>
        </button>
        ${isOpen ? renderClusterPanel(opp, cluster) : ""}
      `;
    }

    function renderClusterPanel(opp, cluster) {
      const evidence = collectClusterEvidence(cluster);
      const key = clusterLimitKey(opp.id, cluster.cluster_id);
      const evidenceLimit = Math.min(evidence.length, evidenceLimits[key] || INITIAL_EVIDENCE_LIMIT);
      const visibleEvidence = evidence.slice(0, evidenceLimit);
      return `
        <div class="cluster-panel">
          <div class="cluster-panel-title">
            <div>
              <div class="cluster-name">${escapeHtml(cluster.name)}</div>
              <div class="cluster-count">${escapeHtml(cluster.type)} · ${formatNum(visibleEvidence.length)} / ${formatNum(evidence.length)} 条证据</div>
            </div>
            ${renderEvidenceActions(key, evidenceLimit, evidence.length)}
          </div>
          ${visibleEvidence.map(renderEvidence).join("") || `<div class="empty">暂无评论证据。</div>`}
        </div>
      `;
    }

    function clusterLimitKey(opportunityId, clusterId) {
      return `${opportunityId}::${clusterId}`;
    }

    function renderEvidenceActions(id, visibleCount, totalCount) {
      if (totalCount <= INITIAL_EVIDENCE_LIMIT) return "";
      const escapedId = escapeHtml(id);
      const total = String(totalCount);
      const actions = [];
      if (visibleCount < totalCount) {
        actions.push(`<button class="small-button" type="button" data-evidence-action="more" data-id="${escapedId}" data-total="${total}">更多 20 条</button>`);
        actions.push(`<button class="small-button" type="button" data-evidence-action="all" data-id="${escapedId}" data-total="${total}">展开全部</button>`);
      }
      if (visibleCount > INITIAL_EVIDENCE_LIMIT) {
        actions.push(`<button class="small-button" type="button" data-evidence-action="less" data-id="${escapedId}" data-total="${total}">收起到 ${INITIAL_EVIDENCE_LIMIT} 条</button>`);
      }
      return `<div class="evidence-actions">${actions.join("")}</div>`;
    }

    function renderEvidence(comment) {
      const author = comment.author_nickname || "未知用户";
      const source = comment.source || "未知渠道";
      const keyword = comment.keyword ? `搜索词：${comment.keyword}` : "";
      const likes = Number(comment.like_count || 0);
      const replies = Number(comment.reply_count || 0);
      const link = comment.comment_url || comment.parent_post_url || "";
      const postTitle = (comment.parent_post_title || "").replace(/\s+/g, " ").trim();
      return `
        <div class="evidence">
          <p class="quote">“${escapeHtml(comment.comment_text)}”</p>
          <div class="meta">
            <span>${escapeHtml(source)}</span>
            <span>${escapeHtml(author)}</span>
            ${keyword ? `<span>${escapeHtml(keyword)}</span>` : ""}
            <span>点赞 ${formatNum(likes)}</span>
            <span>回复 ${formatNum(replies)}</span>
            ${link ? `<a href="${escapeHtml(link)}" target="_blank" rel="noreferrer">原文链接</a>` : ""}
          </div>
          ${postTitle ? `<div class="context">评论背景：${escapeHtml(postTitle.slice(0, 150))}${postTitle.length > 150 ? "..." : ""}</div>` : ""}
        </div>
      `;
    }

    fetch(DATA_URL)
      .then(response => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      })
      .then(data => {
        mapData = data;
        render();
      })
      .catch(error => {
        app.className = "empty";
        app.innerHTML = `读取数据失败：${escapeHtml(error.message)}。请通过本地服务访问本页。`;
      });
  </script>
</body>
</html>
